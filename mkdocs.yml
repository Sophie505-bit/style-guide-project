site_name: "Стайлгайд: документация по разработке ПО"
site_description: Руководство по стилю документации для разработки ПО в организации
site_author: Команда документации · ИТМО, «Проектная документация»
site_url: https://sophie505-bit.github.io/style-guide-project/
repo_url: https://github.com/Sophie505-bit/style-guide-project
repo_name: style-guide-project
copyright: © 2026 Команда документации · Лабораторная работа «Проектная документация»

theme:
  name: material
  language: ru
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Manrope
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - content.action.edit
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Главная: index.md
  - О руководстве: about.md
  - Принципы: principles.md
  - Текст:
      - Голос и тон: text/tone.md
      - Терминология: text/terminology.md
      - Числа, даты и единицы измерения: text/numbers-dates.md
      - Доступность текста: text/accessibility.md
  - Оформление:
      - Заголовки, списки и таблицы: formatting/structure.md
      - Типографика и выделения: formatting/typography.md
      - Код и команды: formatting/code.md
      - Ссылки и изображения: formatting/links-images.md
  - Документы:
      - README: documents/readme.md
      - Инструкции (how-to): documents/how-to.md
      - Справочник API: documents/api.md
      - Журнал изменений: documents/changelog.md
  - Именование: naming.md
  - Процессы:
      - Коммиты: process/commits.md
      - Ветки и Pull Request: process/branches-pr.md
      - Ревью документации: process/review.md
  - Глоссарий: glossary.md
